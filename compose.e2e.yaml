services:
  db_e2e:
    image: neondatabase/neon_local:v1.5
    ports:
      - "5433:5432"
    environment:
      NEON_API_KEY: ${NEON_API_KEY}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID}
      PARENT_BRANCH_ID: ${PARENT_BRANCH_ID}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    # e2e/lib/db.ts and playwright.config.ts hard-code the e2e database at
    # localhost:5433, matching host-based `pnpm run test:e2e`. Sharing the
    # host network keeps that working from inside the container too, instead
    # of needing db_e2e's internal hostname/port.
    network_mode: host
    environment:
      - RUN_MIGRATIONS=true
      - DATABASE_URL
      - ELEVENLABS_API_KEY
      - ELEVENLABS_AGENT_ID
      - ELEVENLABS_AGENT_PARENT_BRANCH_ID
      - ELEVENLABS_WORKFLOW_NODE_ID
    volumes:
      - .:/app
      - /app/node_modules
    # Open Playwright's UI mode instead of running tests immediately. Bound
    # to loopback only: with network_mode: host, --ui-host 0.0.0.0 would
    # expose this unauthenticated runner (and the ElevenLabs/DB credentials
    # it holds) to the whole network, not just this machine.
    command: ["./e2e/test-e2e.sh", "--ui", "--ui-host", "127.0.0.1", "--ui-port", "9323"]
    depends_on:
      db_e2e:
        condition: service_healthy
