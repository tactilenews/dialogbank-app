services:
  db_e2e:
    image: neondatabase/neon_local:v1.5
    ports:
      - "5433:5432"
    environment:
      NEON_API_KEY: ${NEON_API_KEY}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID}
      PARENT_BRANCH_ID: ${PARENT_BRANCH_ID}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    # e2e/lib/db.ts and playwright.config.ts hard-code the e2e database at
    # localhost:5433, matching host-based `pnpm run test:e2e`. Sharing the
    # host network keeps that working from inside the container too, instead
    # of needing db_e2e's internal hostname/port.
    network_mode: host
    environment:
      - DATABASE_URL
      - ELEVENLABS_API_KEY
      - ELEVENLABS_AGENT_ID
      - ELEVENLABS_AGENT_PARENT_BRANCH_ID
      - ELEVENLABS_WORKFLOW_NODE_ID
    volumes:
      - .:/app
      - /app/node_modules
    tty: true
    stdin_open: true
    depends_on:
      db_e2e:
        condition: service_healthy
