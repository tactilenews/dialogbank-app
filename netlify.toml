[build]
command = "pnpm run build"
publish = "build"

# Context-specific override for production
[context.production]
command = "pnpm run db:migrate && pnpm run build"

# Branch deploys receive the values that `pnpm preview:up` last wrote to
# Infisical `prod` `/preview`, which belong to exactly one branch. Netlify is set
# to build no branches on push, so only the build hook that `preview:up` calls
# starts branch deploys. As a second line of defense, any branch other than
# PREVIEW_BRANCH is skipped, and the build command fails if the skip does not
# apply. Branches cut before this file existed lack both checks, which is why
# the Netlify setting matters.
[context.branch-deploy]
ignore = 'test "$PREVIEW_BRANCH" != "$BRANCH"'
command = '''
if [ "$PREVIEW_BRANCH" != "$BRANCH" ]; then
  echo "Infisical prod /preview is set up for '$PREVIEW_BRANCH', not '$BRANCH'. Run pnpm preview:up on this branch." >&2
  exit 1
fi
pnpm run db:migrate && pnpm run build
'''

# Pull requests get no environment values, and previews are set up explicitly
# with `pnpm preview:up` instead.
[context.deploy-preview]
ignore = "true"
