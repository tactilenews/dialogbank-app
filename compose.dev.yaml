services:
  db:
    image: neondatabase/neon_local:v1.5
    ports:
      - "5432:5432"
    environment:
      NEON_API_KEY: ${NEON_API_KEY}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID}
      PARENT_BRANCH_ID: ${PARENT_BRANCH_ID}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
    ports:
      - "5173:5173"
    environment:
      - DATABASE_URL
      - BETTER_AUTH_SECRET
      - ORIGIN
      - ELEVENLABS_API_KEY
      - ELEVENLABS_AGENT_ID
      - ELEVENLABS_WEBHOOK_SECRET
      - SENTRY_DSN
      - PUBLIC_SENTRY_DSN
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
