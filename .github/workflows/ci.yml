name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint & Type Check
        run: |
          pnpm lint
          pnpm check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Unit Tests
        run: pnpm test:unit --run

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Start services
        run: docker compose -f compose.e2e.yaml up -d --wait db_e2e
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PARENT_BRANCH_ID: ${{ secrets.PARENT_BRANCH_ID }}
      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Run Database Migrations
        run: pnpm run db:migrate
        env:
          # The neon_local proxy started above. Its Postgres (TCP) endpoint only
          # accepts the fixed neon:npg credentials, unlike the HTTP one the tests use.
          DATABASE_URL: postgres://neon:npg@localhost:5433/neondb
      - name: E2E Tests
        run: pnpm test:e2e
        env:
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
          ELEVENLABS_AGENT_PARENT_BRANCH_ID: ${{ secrets.ELEVENLABS_AGENT_PARENT_BRANCH_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_WORKFLOW_NODE_ID: ${{ secrets.ELEVENLABS_WORKFLOW_NODE_ID }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build App & Storybook
        run: |
          pnpm build
          pnpm build-storybook
