services:
  db:
    image: neondatabase/neon_local:v1.5
    # No ports published: db is only reachable from other containers.
    environment:
      NEON_API_KEY: ${NEON_API_KEY}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID}
      PARENT_BRANCH_ID: ${PARENT_BRANCH_ID}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot migration runner. web and studio both depend on this completing
  # successfully instead of each running `db:migrate` themselves, so they
  # don't race each other applying the same pending migration concurrently.
  migrate:
    build:
      context: .
    # Its own command already runs the migration; RUN_MIGRATIONS is left
    # unset here so the entrypoint doesn't also run it via that path.
    command: ["pnpm", "run", "db:migrate"]
    environment:
      - DB_HOST=db
      - DATABASE_URL
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
    ports:
      - "5173:5173"
    environment:
      - DB_HOST=db
      - DATABASE_URL
      - BETTER_AUTH_SECRET
      - ORIGIN
      - ELEVENLABS_API_KEY
      - ELEVENLABS_AGENT_ID
      - ELEVENLABS_AGENT_BRANCH_NAME
      - ELEVENLABS_POST_CALL_WEBHOOK_ID
      - ELEVENLABS_WORKFLOW_NODE_ID
      - ELEVENLABS_WEBHOOK_SECRET
      - SENTRY_DSN
      - PUBLIC_SENTRY_DSN
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  studio:
    build:
      context: .
    # The host side is loopback-only via the network default below (this is
    # an unauthenticated database UI). The process itself still needs to bind
    # 0.0.0.0 (below) for Docker's port publishing to reach it.
    ports:
      - "4983:4983"
    # `pnpm run db:studio` binds drizzle-kit to 127.0.0.1 despite its --help
    # claiming 0.0.0.0 is the default, so it's unreachable through the
    # published port. Call the binary directly and force the bind address.
    command: ["pnpm", "exec", "drizzle-kit", "studio", "--host", "0.0.0.0"]
    environment:
      - DB_HOST=db
      - DATABASE_URL
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # E2E gets its own database, since the tests reset it. Both E2E services
  # only start when targeted, e.g. `docker compose up e2e`.
  db_e2e:
    profiles: ["e2e"]
    image: neondatabase/neon_local:v1.5
    ports:
      - "5433:5432"
    environment:
      NEON_API_KEY: ${NEON_API_KEY}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID}
      PARENT_BRANCH_ID: ${PARENT_BRANCH_ID}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    # The host side is loopback-only via the network default below (this is
    # an unauthenticated test runner holding the ElevenLabs/DB credentials).
    # The UI itself still binds 0.0.0.0 (below) for Docker's port publishing
    # to reach it.
    ports:
      - "9323:9323"
    environment:
      # The tests and the app under test reach the e2e database over the
      # compose network, not the host-published 5433 that host-based
      # `pnpm run test:e2e` (and CI) use by default.
      - E2E_DATABASE_URL=postgres://user:password@db_e2e:5432/neondb
      # Migrations connect over Postgres (TCP), where neon_local only accepts
      # its fixed neon:npg credentials.
      - DATABASE_URL=postgres://neon:npg@db_e2e:5432/neondb
      - RUN_MIGRATIONS=true
      - ELEVENLABS_API_KEY
      - ELEVENLABS_AGENT_ID
      - ELEVENLABS_AGENT_PARENT_BRANCH_ID
      - ELEVENLABS_WORKFLOW_NODE_ID
    volumes:
      - .:/app
      - /app/node_modules
    # Open Playwright's UI mode instead of running tests immediately.
    command: ["./e2e/test-e2e.sh", "--ui", "--ui-host", "0.0.0.0", "--ui-port", "9323"]
    depends_on:
      db_e2e:
        condition: service_healthy

# Published ports bind to loopback instead of Docker's default of every host
# interface, so nothing here (dev server, Drizzle Studio, the e2e database and
# Playwright UI) is reachable from the local network: the data behind them is
# a copy of the staging database and Studio/Playwright have no authentication.
# Opt in temporarily with `BIND_ADDR=0.0.0.0 docker compose up`. A port that
# names its own host IP keeps it.
networks:
  default:
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "${BIND_ADDR:-127.0.0.1}"
